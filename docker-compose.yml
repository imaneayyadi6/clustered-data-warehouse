services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: cdw
      POSTGRES_PASSWORD: cdwpass
      POSTGRES_DB: cdw_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdw"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/cdw_db
      SPRING_DATASOURCE_USERNAME: cdw
      SPRING_DATASOURCE_PASSWORD: cdwpass
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace

volumes:
  db_data:
